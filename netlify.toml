# Netlify configuration file

# Build settings
[build]
  publish = "dist"
  command = "npm run build"

# The retired reputation overview should not leave visitors on an empty SPA route.
[[redirects]]
  from = "/reputation"
  to = "/"
  status = 301
  force = true

# Redirect all remaining routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
